name: extracto

services:
  postgres:
    image: postgres:16-alpine
    container_name: extracto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-extracto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extracto_pass}
      POSTGRES_DB: ${POSTGRES_DB:-extracto_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - extracto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-extracto_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: extracto_api:latest
    build:
      context: ..
      dockerfile: ai_rfp_excel/Dockerfile
    container_name: extracto_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-extracto_user}:${POSTGRES_PASSWORD:-extracto_pass}@postgres:5432/${POSTGRES_DB:-extracto_db}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ../ai_rfp_excel:/app/ai_rfp_excel
      - upload_data:/app/data/uploads
      - extracted_data:/app/data/extracted
      - image_data:/app/data/images
      - ocr_data:/app/data/ocr
      - processed_data:/app/data/processed
      - generated_data:/app/data/generated
    command: ["uvicorn", "ai_rfp_excel.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - extracto_network

  frontend:
    profiles: ["full"]
    image: extracto_frontend:latest
    build:
      context: ..
      dockerfile: ai_rfp_excel/Dockerfile.frontend
    container_name: extracto_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - extracto_network

  backup:
    image: postgres:16-alpine
    container_name: extracto_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-extracto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extracto_pass}
      POSTGRES_DB: ${POSTGRES_DB:-extracto_db}
      BACKUP_DIR: /backups
      RETENTION_DAYS: 14
    volumes:
      - backups_data:/backups
    entrypoint: |
      /bin/sh -c '
      while true; do
        TIMESTAMP=$$(date +"%Y%m%d_%H%M%S")
        echo "[Automated Backup] Starting daily pg_dump to /backups/extracto_db_backup_$${TIMESTAMP}.sql.gz..."
        PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB | gzip > /backups/extracto_db_backup_$${TIMESTAMP}.sql.gz
        find /backups -name "extracto_db_backup_*.sql.gz" -mtime +14 -delete
        echo "[Automated Backup] Sleeping for 24 hours until next scheduled backup..."
        sleep 86400
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - extracto_network

networks:
  extracto_network:
    driver: bridge

volumes:
  postgres_data:
  backups_data:
  upload_data:
  extracted_data:
  image_data:
  ocr_data:
  processed_data:
  generated_data:
