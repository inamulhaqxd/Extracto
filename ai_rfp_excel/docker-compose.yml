version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tender_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tender_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tender_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tender_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tender_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: ai_rfp_excel/Dockerfile
    container_name: tender_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tender_user}:${POSTGRES_PASSWORD:-tender_pass}@postgres:5432/${POSTGRES_DB:-tender_db}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - upload_data:/app/data/uploads
      - extracted_data:/app/data/extracted
      - image_data:/app/data/images
      - ocr_data:/app/data/ocr
      - processed_data:/app/data/processed
      - generated_data:/app/data/generated
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tender_network

  streamlit:
    build:
      context: ..
      dockerfile: ai_rfp_excel/Dockerfile.frontend
    container_name: tender_streamlit
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    networks:
      - tender_network

  backup:
    image: postgres:16-alpine
    container_name: tender_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tender_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tender_db}
      BACKUP_DIR: /backups
      RETENTION_DAYS: 14
    volumes:
      - backups_data:/backups
    entrypoint: |
      /bin/sh -c '
      while true; do
        TIMESTAMP=$$(date +"%Y%m%d_%H%M%S")
        echo "[Automated Backup] Starting daily pg_dump to /backups/tender_db_backup_$${TIMESTAMP}.sql.gz..."
        PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB | gzip > /backups/tender_db_backup_$${TIMESTAMP}.sql.gz
        find /backups -name "tender_db_backup_*.sql.gz" -mtime +14 -delete
        echo "[Automated Backup] Sleeping for 24 hours until next scheduled backup..."
        sleep 86400
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tender_network

networks:
  tender_network:
    driver: bridge

volumes:
  postgres_data:
  backups_data:
  upload_data:
  extracted_data:
  image_data:
  ocr_data:
  processed_data:
  generated_data:

