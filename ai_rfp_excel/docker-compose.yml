version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tender_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tender_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender_password}
      POSTGRES_DB: ${POSTGRES_DB:-tender_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - tender_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tender_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tender_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - tender_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_PARALLEL=${OLLAMA_PARALLEL:-2}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender_fastapi
    restart: unless-stopped
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tender_user}:${POSTGRES_PASSWORD:-tender_password}@postgres:5432/${POSTGRES_DB:-tender_db}
      - OLLAMA_BASE_URL=http://ollama:11434
      - UPLOAD_DIR=/app/data/uploads
      - PROCESSED_DIR=/app/data/processed
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/processed:/app/data/processed
      - ./data/extracted:/app/data/extracted
      - ./data/images:/app/data/images
      - ./data/ocr:/app/data/ocr
      - ./data/generated:/app/data/generated
    networks:
      - tender_network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: tender_streamlit
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      - FASTAPI_URL=http://fastapi:8000
    networks:
      - tender_network
    depends_on:
      - fastapi

volumes:
  postgres_data:
  ollama_data:

networks:
  tender_network:
    driver: bridge
